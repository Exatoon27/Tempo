<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tempo</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-mist-100 text-lime-800 max-w-6xl m-auto px-2 sm:px-4 md:px-6 min-w-72">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 p-3 sm:p-4">
        <div class="flex items-center gap-3 sm:gap-4">
            <!-- TODO: Make a history -->
            <button class="bg-mist-300 p-2 rounded-lg hover:bg-mist-400 transition-colors duration-300 active:scale-95 shrink-0">
                <i data-lucide="clock"></i>
            </button>
            <div class="flex flex-col">
                <div class="font-mono text-xs font-bold uppercase text-slate-600" data-i18n="HeaderClockSubtitle">Every minute counts</div>
                <div class="font-sans text-base sm:text-lg leading-none font-bold tracking-tight">Tempo</div>
            </div>
        </div>
        <!-- Language Selector -->
        <div class="flex flex-col items-center shrink-0">
            <p class="subtitle" data-i18n="HeaderLanguageLabel">Language</p>
            <select id="language-selector" class="bg-mist-100 border border-lime-800 p-1 rounded-lg text-sm open:rounded-b-none" onchange="changeLanguage()">
            </select>
        </div>
    </header>
    <!-- Hero -->
    <section class="flex flex-col items-center justify-center text-center py-10 sm:py-16 w-full max-w-4xl m-auto px-2">
        <p class="font-mono text-xs font-bold uppercase tracking-widest text-primary" data-i18n="HeroTitle">Time calculator</p>
        <p class="text-balance font-sans text-3xl sm:text-4xl md:text-5xl font-bold tracking-tighter text-lime-900" data-i18n="HeroHook">Make time add up.</p>
        <p class="mx-auto mt-4 max-w-md text-pretty text-sm sm:text-base leading-6 text-slate-600" data-i18n="HeroSubtitle">Make operations of hours and minutes with a calculator that thinks intime, not decimals.</p>
    </section>
    <!-- Calculator -->
    <section id="calculator" class="flex flex-col items-center justify-center text-center py-10 sm:py-16 w-full max-w-4xl m-auto h-full px-2">
        <!-- Frame -->
        <div class="flex flex-col items-center justify-center gap-3 sm:gap-4 w-full max-w-md bg-mist-300 p-3 sm:p-4 rounded-lg shadow-lg">
            <!-- Screen -->
            <div class="flex flex-col items-center justify-center w-full bg-mist-100 p-3 sm:p-4 rounded-lg shadow-inner overflow-hidden">
                <!-- First Row -->
                <div class="flex justify-between w-full mb-2 text-slate-400 font-mono text-lg sm:text-2xl text-right">
                    <input id="screen1RowLeft" class="max-w-1/2 focus:outline-none cursor-default" readonly placeholder="0:00 (+0)"></input>
                    <input id="screen1RowRight" class="max-w-1/2 text-right focus:outline-none cursor-default" readonly placeholder="0:00"></input>
                </div>
                <!-- Second Row -->
                <input id="screen2Row" class="w-full bg-mist-100 text-lime-800 text-right text-xl sm:text-2xl font-mono rounded-lg resize-none focus:outline-none cursor-default overflow-x-auto" readonly placeholder="0"></input>
            </div>
            <!-- Buttons -->
            <div class="grid grid-cols-4 gap-1.5 sm:gap-2 w-full">
                <!-- Row 1 -->
                <button id="del" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 flex justify-center items-center disabled:bg-mist-400"><i data-lucide="delete"></i></button>
                <button id="clr" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">C</button>
                <button id="per" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">%</button>
                <button id="div" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">÷</button>
                <!-- Row 2 -->
                <button id="7" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4  rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">7</button>
                <button id="8" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4  rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">8</button>
                <button id="9" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4  rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">9</button>
                <button id="mul" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">x</button>
                <!-- Row 3 -->
                <button id="4" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">4</button>
                <button id="5" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">5</button>
                <button id="6" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">6</button>
                <button id="sub" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 flex justify-center items-center disabled:bg-mist-400"><i data-lucide="minus"></i></button>
                <!-- Row 4 -->
                <button id="1" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">1</button>
                <button id="2" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">2</button>
                <button id="3" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">3</button>
                <button id="sum" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">+</button>
                <!-- Row 5 -->
                <button id="0" class="bg-mist-200 p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400 col-span-2">0</button>
                <button id="sep" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">:</button>
                <button id="eql" class="bg-mist-200 aspect-square sm:aspect-video p-2 sm:p-4 rounded-lg hover:bg-mist-300 transition-colors duration-300 active:scale-95 disabled:bg-mist-400">=</button>
            </div>
        </div>
    </section>

    <!-- Post Scripts -->
    <script src="scripts/lang.js"></script>
    <script src="scripts/calc.js"></script>
    <script src="scripts/buttons.js"></script>
    <!-- Icons Processing -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
